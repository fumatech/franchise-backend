---
deployment:
  tasks:
    - /bin/echo "=== Deploying franchise-backend ==="

    # Build jar
    - /bin/mvn -q -DskipTests package

    # Ensure deploy folder exists
    - /bin/mkdir -p /home/fuma/public_html/backend_fumaretail

    # Copy jar
    - /bin/cp target/*.jar /home/fuma/public_html/backend_fumaretail/app.jar

    # Stop old PM2 process
    - cd /home/fuma/public_html/backend_fumaretail && /bin/pm2 delete franchise-backend || true

    # Start new jar
    - cd /home/fuma/public_html/backend_fumaretail && /bin/pm2 start app.jar --name franchise-backend --interpreter none --restart-delay 5000

    - /bin/pm2 save

    - /bin/echo "=== franchise-backend deploy complete ==="
